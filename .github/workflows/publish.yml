name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Trusted Publishing: rubygems.org accepts a short-lived OIDC token
  # minted by GitHub Actions instead of a long-lived API key, so we
  # never have to embed a RUBYGEMS_API_KEY (and never run into the
  # MFA-OTP-in-CI problem that account-level MFA enforces).
  # Configure once at https://rubygems.org/gems/payhub/trusted_publishers
  # → "GitHub Actions" → repo safwatech/payhub-ruby, workflow
  # publish.yml, environment (none).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Stage shared test vectors at the path tests expect
        run: |
          # spec_helper.rb does Pathname.new(__dir__).join("..", "..", "shared", "test-vectors")
          # — i.e. spec/../../shared/test-vectors which on the monorepo
          # is sdks/shared/test-vectors. On the mirror, vectors live in
          # vendor/shared/test-vectors/; stage a sibling 'shared/' so the
          # path resolves identically.
          mkdir -p ../shared
          cp -R vendor/shared/test-vectors ../shared/
      - run: bundle exec rspec
      - name: Build
        run: gem build payhub.gemspec
      - name: Configure RubyGems trusted-publishing credentials
        uses: rubygems/configure-rubygems-credentials@v1.0.0
      - name: Push
        run: gem push payhub-*.gem
